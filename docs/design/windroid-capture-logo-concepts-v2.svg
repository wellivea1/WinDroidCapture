<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="sheet-title sheet-description">
  <title id="sheet-title">WinDroid Capture — six logo concepts</title>
  <desc id="sheet-description">Editable vector concept sheet for a Windows Android camera and screen capture application. Six directions: Phone Lens, Frame Bridge, WDC Monogram, Capture Port, Signal Window, Pixel Aperture. Each includes a main light version, a dark version, monochrome and an actual 24-pixel-size sample.</desc>
  <metadata>Created 2026-10-13. Revision 2: the full Phone Lens ring fits within the phone screen with a 5.5-unit horizontal inset on each side of the 200-unit icon viewBox. Revision 1 is preserved. Flat SVG interpretation of windroid-capture-logo-concepts-v2.png. All marks are paths and shapes with explicit colors; text stays editable. No CSS custom properties or external assets. Original Android Webcam Manager concept board is preserved. Blue #1688f0, charcoal #191c20.</metadata>
